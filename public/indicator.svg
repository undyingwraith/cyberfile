<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <mask id="mask-main">
      <rect x="0" y="0" width="100" height="100" fill="white" />
      <rect x="0" y="45" width="100" height="10" fill="black"/>
      <rect x="15" y="40" width="70" height="20" fill="black"/>
      <circle cx="50" cy="50" r="25" fill="black" />
    </mask>
    <mask id="mask-center">
      <rect x="0" y="0" width="100" height="100" fill="white" />
      <rect x="45" y="45" width="10" height="10" fill="black"/>
    </mask>
  </defs>
  <circle cx="50" cy="50" r="50" mask="url(#mask-main)" />
  <circle cx="50" cy="50" r="20" fill="none" stroke="black" stroke-width="3" />
  <rect x="30" y="45" width="40" height="10" fill="black" mask="url(#mask-center)"/>
</svg>
